services:
  app:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
    # Chrome (wwjs engine) allocates large buffers; Docker's default /dev/shm
    # is only 64MB and Chrome dies with "Fatal process OOM" or silently
    # disconnects WhatsApp Web without this.
    shm_size: "1gb"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - WA_ENGINE=baileys
      - API_KEY=${API_KEY:-changeme}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=whatsapp_gateway
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=
      - REDIS_DB=0
      - DATA_DIR=/app/data
      - MSG_MIN_DELAY=3000
      - MSG_MAX_DELAY=5000
      - MSG_MAX_PER_MINUTE=10
      - MSG_MAX_PER_HOUR=200
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whatsapp_gateway
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
